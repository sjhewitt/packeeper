[package]
name = "pac-keeper-desktop"
version = "0.5.1"
edition = "2024"
description = "PAC Keeper for macOS and Windows"
homepage = "https://packeeper.ca"
publish = false

[dependencies]
anyhow = "1.0.104"
# No SQLCipher: the desktop app keeps one PAC, and PAC Keeper does not encrypt it.
pac-keeper = { path = "..", default-features = false }
serde_json = "1.0.154"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-updater = "2.14.0"
tokio = { version = "1.53.2", features = ["time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[profile.release]
strip = true
lto = "thin"
