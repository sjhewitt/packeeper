<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PAC Keeper</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f6f7f9; color: #1d2733; line-height: 1.45; }
    main { max-width: 540px; margin: 48px auto; padding: 0 24px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    pre { white-space: pre-wrap; background: #fbe9ea; color: #a4262c; padding: 12px 14px; border-radius: 6px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>PAC Keeper could not start</h1>
    <pre id="why">PAC Keeper did not say why.</pre>
    <p>Close PAC Keeper and open it again. If this message comes back, send it to hello@packeeper.ca.</p>
  </main>
  <script>
    if (window.PAC_KEEPER_ERROR) document.getElementById('why').textContent = window.PAC_KEEPER_ERROR;
  </script>
</body>
</html>
