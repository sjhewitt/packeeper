# Builds PAC Keeper for download: one .dmg for every Mac (Apple silicon and
# Intel), one installer for Windows, and the server program for Linux. The
# desktop apps are not signed yet.
#
# Run it from the Actions tab to get the files as build artifacts. Push a tag
# such as v0.2.0 to also make a draft GitHub release with the files attached.

name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows
            runner: windows-latest
            rust_targets: ""
            args: --bundles nsis
            files: target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> ../target
          key: ${{ matrix.name }}

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: PAC Keeper ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: |
            Download the file for your computer:

            - **Mac**: the `.dmg` file. Open it and drag PAC Keeper to Applications.
            - **Windows**: the `-setup.exe` file. Run it. It installs for you only, so it does not ask for an administrator.

            These apps are not signed yet, so the computer warns you the first time:

            - **Mac**: macOS says it cannot check PAC Keeper. Click Done. Open System Settings, then Privacy & Security. Scroll down and click Open Anyway next to PAC Keeper.
            - **Windows**: "Windows protected your PC" shows. Click More info, then Run anyway.

            The records stay on your computer. In PAC Keeper, Settings shows the folder and saves backups.

            To run your own server: `pac-keeper-linux-x86_64.tar.gz` holds the program for any 64-bit Linux server, and start and stop scripts for Opalstack. See the README.

      - uses: actions/upload-artifact@v4
        with:
          name: pac-keeper-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # The server program for Linux, as one static file that runs on any 64-bit
  # Linux, old or new (musl, no system libraries needed).
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-musl

      - name: Install the musl C tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          mkdir -p dist/pac-keeper
          cp target/x86_64-unknown-linux-musl/release/pac-keeper dist/pac-keeper/
          cp deploy/opalstack/start deploy/opalstack/stop deploy/opalstack/upgrade deploy/opalstack/env.example deploy/opalstack/backup deploy/opalstack/backup.env.example dist/pac-keeper/
          tar -C dist -czf pac-keeper-linux-x86_64.tar.gz pac-keeper
          ./dist/pac-keeper/pac-keeper --version

      - uses: actions/upload-artifact@v4
        with:
          name: pac-keeper-linux-x86_64
          path: pac-keeper-linux-x86_64.tar.gz
          if-no-files-found: error

  # For a tag: add the server program to the draft release that the desktop
  # builds made.
  attach:
    if: github.ref_type == 'tag'
    needs: [build, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pac-keeper-linux-x86_64

      - name: Add to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" pac-keeper-linux-x86_64.tar.gz --clobber --repo "${{ github.repository }}"

      # tauri-action also uploads the Mac .app as a .tar.gz for its updater.
      # PAC Keeper has no updater, and people could take it for the download.
      - name: Remove the updater file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name | select(endswith(".app.tar.gz"))' |
          while read -r name; do
            gh release delete-asset "${{ github.ref_name }}" "$name" --yes --repo "${{ github.repository }}"
          done
