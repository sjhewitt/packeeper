# Deploys to Opalstack, in one of two ways:
#
# - A published release: the server program goes to the demo and the hosted
#   server. Run it from the Actions tab with a tag to deploy that release.
# - A push to main that changes site/: the website goes to pk_site at once,
#   so what it says must be true when you push. Run it from the Actions tab
#   with no tag to deploy the website from main.
#
# A release does not copy the website: a release tagged before a change to
# site/ would put the older website back.
#
# It needs the repository secret OPALSTACK_SSH_KEY: a private SSH key whose
# public key is in pk_user's ~/.ssh/authorized_keys. See "Automatic deploys"
# in the README. The server's own key is pinned below, so the job connects
# only to that server.

name: Deploy

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to deploy, such as v0.2.0. Leave it empty to deploy only the website from main.
        required: false

permissions:
  contents: read

# One deploy at a time; a second one waits for the first.
concurrency:
  group: deploy-opalstack
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  SERVER: pk_user@opal1.opalstack.com
  KNOWN_HOST: opal1.opalstack.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJf1strWqgiu3/U9ZmLT2vThEnzw9vJ8PLG27w+NpldS

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Settings → Environments → opalstack can require an approval before each deploy.
    environment: opalstack
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Download the server program from the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern pac-keeper-linux-x86_64.tar.gz --repo "${{ github.repository }}"

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.OPALSTACK_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "The secret OPALSTACK_SSH_KEY is missing. See Automatic deploys in the README." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts

      - name: Copy the website
        if: env.TAG == ''
        run: rsync -az --delete --exclude .DS_Store site/ "$SERVER:apps/pk_site/"

      - name: Install the program and restart the servers
        if: env.TAG != ''
        run: |
          ssh "$SERVER" 'mkdir -p ~/downloads'
          scp pac-keeper-linux-x86_64.tar.gz "$SERVER:downloads/pac-keeper-$TAG.tar.gz"
          ssh "$SERVER" "set -e
            cd ~/downloads
            rm -rf pac-keeper-$TAG && mkdir pac-keeper-$TAG
            tar -xzf pac-keeper-$TAG.tar.gz -C pac-keeper-$TAG --strip-components=1
            pac-keeper-$TAG/upgrade pac-keeper-$TAG"

      - name: Check the public addresses
        run: |
          failed=0
          for url in https://packeeper.ca/ https://demo.packeeper.ca/login https://app.packeeper.ca/login; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
            echo "$url: $code"
            [ "$code" = 200 ] || failed=1
          done
          exit $failed

      - name: Check that the website is the new one
        if: env.TAG == ''
        run: |
          curl -sf https://packeeper.ca/ -o live.html
          if ! cmp -s live.html site/index.html; then
            echo "https://packeeper.ca/ does not serve site/index.html from this commit." >&2
            exit 1
          fi
          echo "https://packeeper.ca/ serves site/index.html from $(git rev-parse --short HEAD)."
