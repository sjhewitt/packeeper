[package]
name = "pac-keeper"
version = "0.5.1"
edition = "2024"
description = "PAC Keeper: bookkeeping and reports for a BC school Parent Advisory Committee"
homepage = "https://packeeper.ca"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.104"
argon2 = "0.6.0"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie-private", "form", "query"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
encoding_rs = "0.8.42"
hex = "0.4.3"
hmac = "0.13.0"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "hostname", "pool", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "ring"] }
mime_guess = "2.0.5"
rand = "0.10.3"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "chrono", "macros"] }
time = "0.3"
tokio = { version = "1.53.2", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
typst = "0.15"
typst-as-lib = { version = "0.17.0", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-layout = "0.15"
typst-pdf = "0.15"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

# SQLCipher in place of SQLite, so that a hosted server can encrypt its records
# (PAC_DATA_KEY). It uses Apple's crypto on a Mac and a built-in OpenSSL on
# Linux. With no key, it works as plain SQLite. Same version as sqlx uses.
[target.'cfg(target_vendor = "apple")'.dependencies]
libsqlite3-sys = { version = "0.37.0", optional = true, features = ["bundled-sqlcipher"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
libsqlite3-sys = { version = "0.37.0", optional = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[features]
default = ["encryption"]
# The desktop app turns this off: it keeps one PAC on the treasurer's computer.
encryption = ["dep:libsqlite3-sys"]

[profile.release]
strip = true
lto = "thin"
